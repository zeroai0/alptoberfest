<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — ALPTOBERFEST Signups</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #003087; --red: #CC0000; --gold: #FFD700;
      --dark: #060A14; --card: #0C1220; --card2: #111827;
      --border: #1E2D4A; --text: #F0F4FF; --muted: #6B7FA3;
      --green: #22C55E;
    }
    body { background: var(--dark); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; }

    /* Login screen */
    .login-wrap {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .login-box {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 20px; padding: 40px; width: 100%; max-width: 380px; text-align: center;
    }
    .login-title { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
    .login-sub { font-size: 13px; color: var(--muted); margin-bottom: 24px; }
    .login-input {
      width: 100%; background: var(--card2); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 16px; color: var(--text);
      font-size: 15px; font-family: 'Inter', sans-serif; outline: none; margin-bottom: 12px;
      transition: border-color 0.2s; text-align: center; letter-spacing: 2px;
    }
    .login-input:focus { border-color: var(--gold); }
    .login-btn {
      width: 100%; background: linear-gradient(135deg, var(--navy), #004BB5);
      border: 1px solid rgba(255,215,0,0.2); color: var(--gold);
      border-radius: 10px; padding: 13px; font-weight: 800; font-size: 15px;
      cursor: pointer; transition: all 0.2s;
    }
    .login-btn:hover { opacity: 0.9; }
    .login-error { color: var(--red); font-size: 13px; margin-top: 8px; display: none; }

    /* Admin screen */
    .admin-wrap { display: none; padding: 0 0 60px; }

    header {
      background: rgba(6,10,20,0.95); border-bottom: 1px solid var(--border);
      padding: 0 24px; position: sticky; top: 0; z-index: 10;
    }
    .header-inner {
      max-width: 1200px; margin: 0 auto; height: 56px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header-title { font-weight: 800; font-size: 16px; color: var(--gold); }
    .header-count { font-size: 13px; color: var(--muted); }

    .container { max-width: 1200px; margin: 0 auto; padding: 28px 20px; }

    /* Stats row */
    .stats-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
    .stat-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 18px 24px; flex: 1; min-width: 140px;
    }
    .stat-val { font-size: 32px; font-weight: 900; color: var(--gold); line-height: 1; margin-bottom: 4px; }
    .stat-label { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }

    /* Export button */
    .toolbar { display: flex; gap: 10px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
    .export-btn {
      background: linear-gradient(135deg, var(--navy), #004BB5);
      border: 1px solid rgba(255,215,0,0.2); color: var(--gold);
      border-radius: 8px; padding: 8px 20px; font-weight: 700; font-size: 13px;
      cursor: pointer; transition: all 0.2s;
    }
    .export-btn:hover { opacity: 0.9; }
    .search-input {
      background: var(--card2); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 14px; color: var(--text);
      font-size: 13px; font-family: 'Inter', sans-serif; outline: none;
      transition: border-color 0.2s; width: 220px;
    }
    .search-input:focus { border-color: var(--gold); }

    /* Table */
    .table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      padding: 12px 16px; text-align: left; font-size: 10px; font-weight: 800;
      letter-spacing: 2px; text-transform: uppercase; color: var(--muted);
      border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    tbody tr { border-bottom: 1px solid rgba(30,45,74,0.5); transition: background 0.1s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(255,255,255,0.02); }
    td { padding: 13px 16px; font-size: 13px; vertical-align: top; }
    td.name { font-weight: 700; color: var(--text); white-space: nowrap; }
    td.phone, td.email { color: var(--muted); white-space: nowrap; }
    td.org { }
    .org-badge {
      display: inline-block; background: rgba(0,48,135,0.3);
      border: 1px solid rgba(255,215,0,0.2); border-radius: 6px;
      padding: 2px 8px; font-size: 11px; font-weight: 700; color: var(--gold);
    }
    td.alp { font-weight: 700; color: var(--green); white-space: nowrap; }
    td.why { max-width: 280px; color: var(--muted); line-height: 1.5; font-size: 12px; }
    td.prize { max-width: 200px; color: var(--muted); font-size: 12px; line-height: 1.5; }
    td.date { color: var(--muted); font-size: 11px; white-space: nowrap; }
    .tips-yes { color: var(--green); font-size: 12px; font-weight: 700; }
    .tips-no { color: var(--muted); font-size: 12px; }

    /* Empty */
    .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty .icon { font-size: 40px; margin-bottom: 12px; display: block; }

    /* Loading */
    .loading { text-align: center; padding: 60px; color: var(--muted); }
  </style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="login-wrap">
  <div class="login-box">
    <div class="login-title">🏆 Admin Access</div>
    <div class="login-sub">ALPTOBERFEST 2026 — Signup Entries</div>
    <input class="login-input" type="password" id="pass-input" placeholder="Password" onkeydown="if(event.key==='Enter')login()" />
    <button class="login-btn" onclick="login()">Enter</button>
    <div class="login-error" id="login-error">Incorrect password</div>
  </div>
</div>

<!-- ADMIN -->
<div class="admin-wrap" id="admin-wrap">
  <header>
    <div class="header-inner">
      <div class="header-title">ALPTOBERFEST — Signup Entries</div>
      <div class="header-count" id="header-count"></div>
    </div>
  </header>

  <div class="container">
    <div class="stats-row" id="stats-row">
      <div class="stat-card"><div class="stat-val" id="stat-total">—</div><div class="stat-label">Total Signups</div></div>
      <div class="stat-card"><div class="stat-val" id="stat-wo">—</div><div class="stat-label">WO</div></div>
      <div class="stat-card"><div class="stat-val" id="stat-wp">—</div><div class="stat-label">WP</div></div>
      <div class="stat-card"><div class="stat-val" id="stat-avg-alp">—</div><div class="stat-label">Avg ALP Goal</div></div>
    </div>

    <div class="toolbar">
      <input class="search-input" type="text" id="search" placeholder="Search name, email, org..." oninput="renderTable()" />
      <button class="export-btn" onclick="exportCSV()">⬇ Export CSV</button>
    </div>

    <div class="table-wrap">
      <div class="loading" id="loading">Loading entries...</div>
      <table id="entries-table" style="display:none">
        <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Org</th>
            <th>Manager</th>
            <th>ALP Goal</th>
            <th>Why</th>
            <th>Prize Ideas</th>
            <th>Tips ✓</th>
            <th>Submitted</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
      <div class="empty" id="empty-state" style="display:none">
        <span class="icon">📋</span>
        No entries yet — share the form link!
      </div>
    </div>
  </div>
</div>

<script>
  let allEntries = [];
  let adminPass = '';

  function login() {
    const pass = document.getElementById('pass-input').value;
    if (!pass) return;
    adminPass = pass;
    loadEntries();
  }

  async function loadEntries() {
    try {
      const res = await fetch(`/api/admin?pass=${encodeURIComponent(adminPass)}`);
      if (res.status === 401) {
        document.getElementById('login-error').style.display = 'block';
        return;
      }
      const data = await res.json();
      allEntries = data;
      document.getElementById('login-wrap').style.display = 'none';
      document.getElementById('admin-wrap').style.display = 'block';
      document.getElementById('loading').style.display = 'none';
      document.getElementById('entries-table').style.display = 'table';
      updateStats();
      renderTable();
    } catch(e) {
      document.getElementById('login-error').textContent = 'Error loading data';
      document.getElementById('login-error').style.display = 'block';
    }
  }

  function updateStats() {
    const total = allEntries.length;
    const wo = allEntries.filter(e => e.org === 'WO').length;
    const wp = allEntries.filter(e => e.org === 'WP').length;
    const alpGoals = allEntries.filter(e => e.alp_goal).map(e => e.alp_goal);
    const avgAlp = alpGoals.length ? Math.round(alpGoals.reduce((a,b) => a+b, 0) / alpGoals.length) : 0;

    document.getElementById('stat-total').textContent = total;
    document.getElementById('stat-wo').textContent = wo;
    document.getElementById('stat-wp').textContent = wp;
    document.getElementById('stat-avg-alp').textContent = avgAlp ? '$' + avgAlp.toLocaleString() : '—';
    document.getElementById('header-count').textContent = `${total} submission${total !== 1 ? 's' : ''}`;
  }

  function renderTable() {
    const q = document.getElementById('search').value.toLowerCase();
    const filtered = allEntries.filter(e =>
      !q ||
      (e.full_name || '').toLowerCase().includes(q) ||
      (e.email || '').toLowerCase().includes(q) ||
      (e.org || '').toLowerCase().includes(q) ||
      (e.manager || '').toLowerCase().includes(q)
    );

    const tbody = document.getElementById('table-body');
    const emptyState = document.getElementById('empty-state');

    if (filtered.length === 0) {
      tbody.innerHTML = '';
      emptyState.style.display = 'block';
      return;
    }
    emptyState.style.display = 'none';

    tbody.innerHTML = filtered.map((e, i) => {
      const date = e.submitted_at ? new Date(e.submitted_at).toLocaleString('en-US', {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}) : '—';
      return `<tr>
        <td style="color:var(--muted);font-size:12px">${i+1}</td>
        <td class="name">${esc(e.full_name)}</td>
        <td class="phone">${esc(e.phone)}</td>
        <td class="email">${esc(e.email)}</td>
        <td>${e.org ? `<span class="org-badge">${esc(e.org)}</span>` : '<span style="color:var(--muted)">—</span>'}</td>
        <td style="color:var(--muted);font-size:12px">${esc(e.manager) || '—'}</td>
        <td class="alp">${e.alp_goal ? '$' + Number(e.alp_goal).toLocaleString() : '—'}</td>
        <td class="why">${esc(e.goal_why) || '<span style="color:var(--muted)">—</span>'}</td>
        <td class="prize">${esc(e.prize_idea) || '<span style="color:var(--muted)">—</span>'}</td>
        <td>${e.tips_read ? '<span class="tips-yes">✓ Yes</span>' : '<span class="tips-no">No</span>'}</td>
        <td class="date">${date}</td>
      </tr>`;
    }).join('');
  }

  function esc(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function exportCSV() {
    const headers = ['Name','Phone','Email','Org','Manager','ALP Goal','Why','Prize Ideas','Tips Read','Submitted'];
    const rows = allEntries.map(e => [
      e.full_name, e.phone, e.email, e.org, e.manager,
      e.alp_goal, e.goal_why, e.prize_idea,
      e.tips_read ? 'Yes' : 'No',
      e.submitted_at ? new Date(e.submitted_at).toLocaleString() : ''
    ].map(v => `"${String(v || '').replace(/"/g,'""')}"`));

    const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `alptoberfest-signups-${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
  }
</script>
</body>
</html>
